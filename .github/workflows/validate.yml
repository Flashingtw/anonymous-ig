name: Validate isolated local-auth rollout (no deploy)

on:
  push:
    branches:
      - 'codex/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out rollout and pinned production history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check source
        run: npm run check
      - name: Verify isolated boundary and old Worker with new schema
        run: npm run check:rollout
      - name: Run tests
        run: npm test
      - name: Build Worker without deployment
        run: npm run build
      - name: Audit dependencies
        run: npm audit --audit-level=low
